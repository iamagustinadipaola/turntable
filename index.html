<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turntable">
<meta name="theme-color" content="#14100c">
<title>Turntable</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#14100c;color:#f1e6d3;font-family:"Iowan Old Style","Palatino",Georgia,serif;-webkit-user-select:none;user-select:none}
  #bg{position:fixed;inset:-10%;background-size:cover;background-position:center;filter:blur(70px) brightness(.45) saturate(1.3);transition:background-image .6s;transform:scale(1.2)}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:860px;transform-origin:center}
  #plinth{position:absolute;left:30px;top:30px;width:1220px;height:700px;border-radius:34px;
    background:
      repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.07) 7px 8px,rgba(255,255,255,.015) 8px 15px),
      linear-gradient(145deg,#4a2f1d,#2d1b10 60%,#24150c);
    box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 8px rgba(0,0,0,.5)}
  #platter{position:absolute;left:40px;top:30px;width:720px;height:720px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3a3a3c,#151516 70%);
    box-shadow:0 14px 34px rgba(0,0,0,.7),inset 0 0 0 6px #232325,inset 0 0 0 8px #3d3d40}
  #record{position:absolute;left:70px;top:60px;width:660px;height:660px;border-radius:50%;
    background:
      repeating-radial-gradient(circle at center,#0b0b0c 0 2px,#161617 2px 3px,#0d0d0e 3px 5px),
      #0b0b0c;
    box-shadow:0 0 0 2px #000,0 6px 20px rgba(0,0,0,.6);will-change:transform}
  #record::before{content:"";position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
  #record::after{content:"";position:absolute;inset:150px;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
  #label{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;
    background:#c8553d center/cover no-repeat;box-shadow:0 0 0 3px rgba(0,0,0,.5),inset 0 0 20px rgba(0,0,0,.35)}
  #spindle{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f2f2f2,#8d8d90 60%,#4a4a4d);box-shadow:0 2px 4px rgba(0,0,0,.6)}
  #sheen{position:absolute;left:70px;top:60px;width:660px;height:660px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.10) 14%,transparent 22% 58%,rgba(255,255,255,.08) 64%,transparent 72%)}
  #armBase{position:absolute;left:845px;top:95px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d8d8da,#7c7c80 60%,#3d3d40);box-shadow:0 8px 16px rgba(0,0,0,.6),inset 0 0 0 6px rgba(0,0,0,.2)}
  #arm{position:absolute;left:900px;top:150px;width:0;height:0;transform-origin:0 0;cursor:pointer;will-change:transform}
  #arm .tube{position:absolute;left:-5px;top:-10px;width:10px;height:535px;border-radius:5px;
    background:linear-gradient(90deg,#8e8e92,#e8e8ea 45%,#6d6d71);box-shadow:6px 8px 12px rgba(0,0,0,.45)}
  #arm .cw{position:absolute;left:-22px;top:-120px;width:44px;height:78px;border-radius:12px;
    background:linear-gradient(90deg,#4a4a4d,#9a9a9e 50%,#3a3a3d);box-shadow:6px 8px 12px rgba(0,0,0,.45)}
  #arm .stem{position:absolute;left:-8px;top:-50px;width:16px;height:46px;background:#6f6f73;border-radius:4px}
  #arm .head{position:absolute;left:-17px;top:515px;width:34px;height:52px;border-radius:5px 5px 9px 9px;
    background:linear-gradient(90deg,#1c1c1e,#3b3b3e 50%,#18181a);box-shadow:6px 8px 12px rgba(0,0,0,.5)}
  #arm .head::after{content:"";position:absolute;left:12px;bottom:-9px;width:10px;height:12px;background:#d9a441;border-radius:0 0 4px 4px}
  #hit{position:absolute;left:-60px;top:-130px;width:120px;height:720px}
  #info{position:absolute;left:975px;top:255px;width:240px;text-align:left}
  #info .kicker{font:600 13px/1 -apple-system,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#d9a441;margin-bottom:16px}
  #title{font-size:34px;line-height:1.1;font-weight:600;margin-bottom:10px;max-height:150px;overflow:hidden}
  #artist{font-size:21px;color:#e2d3bc;opacity:.9;margin-bottom:6px}
  #album{font-size:16px;font-style:italic;color:#bda98a;opacity:.85}
  #bar{position:absolute;left:30px;top:750px;width:1220px;height:100px;font-family:-apple-system,system-ui,sans-serif}
  #seek{position:absolute;left:40px;right:40px;top:8px;height:34px;cursor:pointer}
  #seek .track{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
  #seek .fill{position:absolute;left:0;top:15px;height:4px;border-radius:2px;background:#d9a441;width:0}
  #seek .knob{position:absolute;top:9px;width:16px;height:16px;border-radius:50%;background:#f1e6d3;margin-left:-8px;left:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .t{position:absolute;top:44px;font-size:14px;opacity:.7;font-variant-numeric:tabular-nums}
  #tcur{left:40px}#tdur{right:40px}
  #ctrls{position:absolute;left:0;right:0;top:36px;display:flex;justify-content:center;gap:34px;align-items:center}
  .btn{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(241,230,211,.35);background:rgba(255,255,255,.05);color:#f1e6d3;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,background .2s}
  .btn:active{transform:scale(.92);background:rgba(255,255,255,.16)}
  .btn.main{width:76px;height:76px;background:#d9a441;color:#1b130b;border-color:#d9a441}
  .btn svg{width:28px;height:28px;fill:currentColor}
  #msg{position:absolute;left:975px;top:255px;width:240px;font:17px/1.5 -apple-system,system-ui,sans-serif;color:#e2d3bc;display:none}
  #gate{position:fixed;inset:0;background:rgba(14,10,7,.94);display:none;align-items:center;justify-content:center;z-index:9;padding:24px;font-family:-apple-system,system-ui,sans-serif}
  #gate .card{max-width:560px;width:100%;background:#241810;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:30px}
  #gate h1{font:600 30px Georgia,serif;margin-bottom:8px}
  #gate p,#gate li{font-size:15px;line-height:1.55;color:#d9ccb8}
  #gate ol{margin:14px 0 18px 20px}
  #gate code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all;-webkit-user-select:text;user-select:text}
  #gate input{width:100%;margin:6px 0 16px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#150d07;color:#fff;font-size:16px;-webkit-user-select:text;user-select:text}
  #gate button{width:100%;padding:15px;border:0;border-radius:12px;background:#d9a441;color:#1b130b;font-size:17px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage">
  <div id="plinth"></div>
  <div id="platter"></div>
  <div id="record"><div id="label"></div><div id="spindle"></div></div>
  <div id="sheen"></div>
  <div id="armBase"></div>
  <div id="arm"><div class="cw"></div><div class="stem"></div><div class="tube"></div><div class="head"></div><div id="hit"></div></div>

  <div id="info">
    <div class="kicker">Now Spinning</div>
    <div id="title">Nothing playing</div>
    <div id="artist"></div>
    <div id="album"></div>
  </div>
  <div id="msg"></div>

  <div id="bar">
    <div id="seek"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="t" id="tcur">0:00</div><div class="t" id="tdur">0:00</div>
    <div id="ctrls">
      <div class="btn" id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></div>
      <div class="btn main" id="play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="btn" id="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></div>
    </div>
  </div>
</div>

<div id="gate"><div class="card">
  <h1>Connect Spotify</h1>
  <p>One-time setup (free). You need a Spotify Premium account to control playback.</p>
  <ol>
    <li>Go to <code>developer.spotify.com/dashboard</code> and create an app.</li>
    <li>Add this exact Redirect URI: <code id="redir"></code></li>
    <li>Tick "Web API", save, then paste the app's Client ID below.</li>
  </ol>
  <input id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="connect">Connect</button>
</div></div>

<script>
(()=>{
const SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing';
const REDIRECT=location.origin+location.pathname;
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- scaling ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/860);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ---------- auth (PKCE) ---------- */
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a)}
async function login(){
  const cid=$('cid').value.trim();if(!cid)return;
  ls.set('cid',cid);
  const verifier=rand(64);ls.set('verifier',verifier);
  const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:'S256',code_challenge:challenge});
  location.href='https://accounts.spotify.com/authorize?'+p;
}
async function tokenReq(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  if(!r.ok)throw new Error('token');
  const d=await r.json();
  ls.set('access',d.access_token);ls.set('expires',String(Date.now()+d.expires_in*1000-30000));
  if(d.refresh_token)ls.set('refresh',d.refresh_token);
}
async function refresh(){
  await tokenReq({grant_type:'refresh_token',refresh_token:ls.get('refresh'),client_id:ls.get('cid')});
}
async function token(){
  if(!ls.get('access'))return null;
  if(Date.now()>+ls.get('expires')){try{await refresh()}catch(e){logout();return null}}
  return ls.get('access');
}
function logout(){['access','refresh','expires'].forEach(ls.del);showGate()}
function showGate(){$('redir').textContent=REDIRECT;$('cid').value=ls.get('cid')||'';$('gate').style.display='flex'}
$('connect').onclick=login;

async function api(path,method='GET'){
  const t=await token();if(!t)return null;
  const r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t}});
  if(r.status===401){try{await refresh();return api(path,method)}catch(e){logout();return null}}
  if(r.status===204||r.status===202)return {empty:true};
  if(!r.ok)return {error:r.status};
  const txt=await r.text();return txt?JSON.parse(txt):{empty:true};
}

/* ---------- state ---------- */
const S={track:null,playing:false,progress:0,at:performance.now(),duration:1,lastId:null};
const fmt=ms=>{ms=Math.max(0,ms|0);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function setMsg(t){const m=$('msg'),i=$('info');if(t){m.textContent=t;m.style.display='block';i.style.display='none'}else{m.style.display='none';i.style.display='block'}}

async function poll(){
  const d=await api('/me/player');
  if(!d)return;
  if(d.error||d.empty||!d.item){
    S.track=null;S.playing=false;
    setMsg(d&&d.error?'Spotify connection hiccup. Retrying…':'Open Spotify on any device and press play. It will appear here.');
    $('bg').style.backgroundImage='';
    return;
  }
  setMsg(null);
  const it=d.item;
  S.playing=d.is_playing;S.progress=d.progress_ms||0;S.at=performance.now();S.duration=it.duration_ms||1;
  if(it.id!==S.lastId){
    S.lastId=it.id;
    const art=(it.album&&it.album.images&&it.album.images[0])?it.album.images[0].url:'';
    $('title').textContent=it.name;
    $('artist').textContent=(it.artists||[]).map(a=>a.name).join(', ');
    $('album').textContent=it.album?it.album.name:'';
    $('label').style.backgroundImage=art?`url(${art})`:'';
    $('bg').style.backgroundImage=art?`url(${art})`:'';
    S.armReset=true;
  }
  S.track=it;
  $('playIcon').innerHTML=S.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
}
setInterval(()=>{if(ls.get('access'))poll()},3000);

/* ---------- controls ---------- */
async function toggle(){
  if(!S.track)return;
  const now=nowProgress();
  S.playing=!S.playing;S.progress=now;S.at=performance.now();
  $('playIcon').innerHTML=S.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  await api(S.playing?'/me/player/play':'/me/player/pause','PUT');
  setTimeout(poll,600);
}
$('play').onclick=toggle;
$('hit').onclick=toggle;
$('next').onclick=async()=>{await api('/me/player/next','POST');setTimeout(poll,500)};
$('prev').onclick=async()=>{
  if(nowProgress()>4000){await api('/me/player/seek?position_ms=0','PUT')}else{await api('/me/player/previous','POST')}
  setTimeout(poll,500)};
$('seek').addEventListener('pointerdown',async e=>{
  if(!S.track)return;
  const r=$('seek').getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  S.progress=f*S.duration;S.at=performance.now();
  await api('/me/player/seek?position_ms='+Math.floor(f*S.duration),'PUT');
  setTimeout(poll,500);
});

/* ---------- animation ---------- */
const PIV={x:900,y:150},C={x:400,y:390},L=550,R_OUT=305,R_IN=128,REST=6;
const d0=Math.hypot(PIV.x-C.x,PIV.y-C.y);
const th0=Math.atan2(PIV.x-C.x,C.y-PIV.y)*180/Math.PI;
function thetaFor(r){
  const cosf=(d0*d0+L*L-r*r)/(2*d0*L);
  return th0-Math.acos(Math.min(1,Math.max(-1,cosf)))*180/Math.PI;
}
function nowProgress(){const p=S.progress+(S.playing?performance.now()-S.at:0);return Math.min(S.duration,Math.max(0,p))}

let ang=0,speed=0,arm=REST,last=performance.now();
const rec=$('record'),armEl=$('arm');
function frame(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  const armDown=S.track&&S.playing;
  const tgtSpeed=armDown?200:0; // 33 1/3 rpm
  speed+=(tgtSpeed-speed)*Math.min(1,dt*(armDown?1.2:0.9));
  ang=(ang+speed*dt)%360;
  rec.style.transform=`rotate(${ang}deg)`;

  const prog=nowProgress();
  const frac=S.track?prog/S.duration:0;
  const target=armDown?thetaFor(R_OUT-(R_OUT-R_IN)*frac):REST;
  arm+=(target-arm)*Math.min(1,dt*2.4);
  armEl.style.transform=`rotate(${arm}deg)`;

  const pct=S.track?frac*100:0;
  $('fill').style.width=pct+'%';
  $('knob').style.left=pct+'%';
  $('tcur').textContent=fmt(S.track?prog:0);
  $('tdur').textContent=fmt(S.track?S.duration:0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* keep the iPad awake while it's on display */
async function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',wake);document.addEventListener('pointerdown',wake,{once:true});

/* ---------- boot ---------- */
(async function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('code')){
    try{
      await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIRECT,client_id:ls.get('cid'),code_verifier:ls.get('verifier')});
    }catch(e){}
    history.replaceState({},'',REDIRECT);
  }
  if(!ls.get('access')){showGate();return}
  poll();
})();
})();
</script>
</body>
</html>
